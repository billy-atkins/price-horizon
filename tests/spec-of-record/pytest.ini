[pytest]
# The settings the kept tests of Spec of Record's scripts are run with, from the folder holding the files to be
# tested, which is the project root unless they stand in a copy of the project's files:
#   python -B -m pytest tests/spec-of-record
# No setting names a place to write: conftest.py puts the run's report and each folder a run writes under the
# run's one folder among the working files.
testpaths = scripts
python_files = test_*.py
python_functions = test_*
junit_family = xunit2
addopts = -p no:cacheprovider --import-mode=importlib --strict-markers -ra
markers =
    action(flag, ...): each action of its script the test drives, by the flag the script states it under
    passes(name, ...): the test holds what it names where that passes; given names, those of what it names alone
    reports(name, ...): the test holds what it names where that reports; given names, those of what it names alone
    reads(file, key, ...): the fixtures the test takes, by their fixture file and their keys
